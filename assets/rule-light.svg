<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="How I build AI near money: the model proposes, deterministic code decides, a human signs off, and everything is logged">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.n{font-size:12px} .h{font-size:14px;font-weight:700;letter-spacing:1.5px}
.v{font-size:18px;font-weight:600} .s{font-size:12.5px}
.b{animation:in .5s ease-out both}
.flow{stroke-dasharray:4 5;animation:dash 1.2s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-18}}
@media (prefers-reduced-motion:reduce){.b,.flow{animation:none}}
</style>
<g class="b" style="animation-delay:0.00s">
<rect x="12" y="14" width="178" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="12" y="14" width="4" height="120" rx="2" fill="#8250df"/>
<text x="30" y="40" class="n" fill="#656d76">01</text>
<text x="56" y="40" class="h" fill="#8250df">MODEL</text>
<text x="30" y="66" class="v" fill="#1f2328">proposes</text>
<text x="30" y="96" class="s" fill="#656d76">LLM / agent drafts the</text>
<text x="30" y="115" class="s" fill="#656d76">answer or action</text>
</g>
<line x1="196" y1="74" x2="222" y2="74" stroke="#656d76" stroke-width="2" class="flow"/><path d="M220 68 l8 6 -8 6" fill="none" stroke="#656d76" stroke-width="2"/>
<g class="b" style="animation-delay:0.25s">
<rect x="230" y="14" width="178" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="230" y="14" width="4" height="120" rx="2" fill="#0550ae"/>
<text x="248" y="40" class="n" fill="#656d76">02</text>
<text x="274" y="40" class="h" fill="#0550ae">GUARD</text>
<text x="248" y="66" class="v" fill="#1f2328">decides</text>
<text x="248" y="96" class="s" fill="#656d76">rules, allow-lists,</text>
<text x="248" y="115" class="s" fill="#656d76">read-only DB roles</text>
</g>
<line x1="414" y1="74" x2="440" y2="74" stroke="#656d76" stroke-width="2" class="flow"/><path d="M438 68 l8 6 -8 6" fill="none" stroke="#656d76" stroke-width="2"/>
<g class="b" style="animation-delay:0.50s">
<rect x="448" y="14" width="178" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="448" y="14" width="4" height="120" rx="2" fill="#9a6700"/>
<text x="466" y="40" class="n" fill="#656d76">03</text>
<text x="492" y="40" class="h" fill="#9a6700">HUMAN</text>
<text x="466" y="66" class="v" fill="#1f2328">signs off</text>
<text x="466" y="96" class="s" fill="#656d76">anything that moves</text>
<text x="466" y="115" class="s" fill="#656d76">money or credit</text>
</g>
<line x1="632" y1="74" x2="658" y2="74" stroke="#656d76" stroke-width="2" class="flow"/><path d="M656 68 l8 6 -8 6" fill="none" stroke="#656d76" stroke-width="2"/>
<g class="b" style="animation-delay:0.75s">
<rect x="666" y="14" width="178" height="120" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
<rect x="666" y="14" width="4" height="120" rx="2" fill="#1a7f37"/>
<text x="684" y="40" class="n" fill="#656d76">04</text>
<text x="710" y="40" class="h" fill="#1a7f37">LOG</text>
<text x="684" y="66" class="v" fill="#1f2328">remembers</text>
<text x="684" y="96" class="s" fill="#656d76">append-only, hash-</text>
<text x="684" y="115" class="s" fill="#656d76">chained audit trail</text>
</g>
</svg>
